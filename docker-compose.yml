version: "3.9"

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: cvuser
      POSTGRES_PASSWORD: cvpass
      POSTGRES_DB: cv_platform
    ports: ["5432:5432"]
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./db/postgres_schema.sql:/docker-entrypoint-initdb.d/01_postgres_schema.sql
      - ./db/timescale_schema.sql:/docker-entrypoint-initdb.d/02_timescale_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cvuser"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes:
      - mongo_data:/data/db

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    depends_on:
      timescaledb: { condition: service_healthy }
      mongo: { condition: service_started }
    environment:
      DATABASE_URL: postgresql+psycopg2://cvuser:cvpass@timescaledb:5432/cv_platform
      MONGO_URL: mongodb://mongo:27017
      JWT_SECRET: change-me-in-prod
    ports: ["8000:8000"]
    volumes:
      - ./ml/artifacts:/app/ml/artifacts:ro

  ingestion:
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    depends_on: [kafka, timescaledb, mongo]
    environment:
      DATABASE_URL: postgresql://cvuser:cvpass@timescaledb:5432/cv_platform
      MONGO_URL: mongodb://mongo:27017
    command: ["python", "consumer.py", "--bootstrap", "kafka:29092"]

  ui:
    image: nginx:alpine
    volumes:
      - ./ui:/usr/share/nginx/html:ro
    ports: ["3000:80"]

  # Optional: run with `docker compose --profile simulate up simulator`
  simulator:
    profiles: ["simulate"]
    build:
      context: .
      dockerfile: simulator/Dockerfile
    depends_on: [kafka]
    command: ["python", "simulator.py", "--vehicles", "100000", "--ticks", "30",
               "--sink", "kafka", "--kafka-bootstrap", "kafka:29092"]

volumes:
  timescale_data:
  mongo_data:
